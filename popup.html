<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --primary: #0060df;
      --primary-hover: #0250bb;
      --danger: #dc3545;
      --secondary: #6c757d;
      --light: #f8f9fa;
      --border: #dee2e6;
      --success: #28a745;
      --warning: #ffc107;
    }

    body {
      width: 380px;
      padding: 15px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      background-color: #ffffff;
      color: #333;
    }

    h3 {
      margin: 0 0 15px 0;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Session Manager Section */
    .session-container {
      background: var(--light);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 15px;
    }

    .session-header {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    select {
      flex-grow: 1;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-size: 14px;
      outline: none;
    }

    .btn-group {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      padding: 6px 10px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: #e9ecef;
      border-color: #adb5bd;
    }

    /* Mode Selector & Auto Controls */
    .mode-container {
      background: #fff;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mode-toggle-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mode-label {
      font-size: 13px;
      font-weight: bold;
      color: #495057;
    }

    .select-mode {
      padding: 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-size: 13px;
      background-color: #fff;
      cursor: pointer;
    }

    .auto-controls {
      display: none; /* Muncul hanya jika mode auto aktif */
      align-items: center;
      justify-content: space-between;
      padding: 8px;
      background: #e8f0fe;
      border-radius: 6px;
      border: 1px solid #d2e3fc;
    }

    .auto-status-indicator {
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot.running { background-color: var(--success); box-shadow: 0 0 6px var(--success); }
    .dot.stopped { background-color: var(--danger); }

    /* Link List Section */
    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    .list-header span {
      font-size: 12px;
      font-weight: bold;
      color: var(--secondary);
    }

    #linkContainer {
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 15px;
    }

    .link-item {
      display: flex;
      align-items: center;
      padding: 8px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
      transition: background 0.1s;
    }

    .link-item:last-child {
      border-bottom: none;
    }

    .link-item:hover {
      background-color: #f1f3f5;
    }

    .link-content {
      flex-grow: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 13px;
    }

    .link-date {
      display: block;
      font-size: 10px;
      color: #888;
    }

    /* Action Buttons */
    .main-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button.primary {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }

    button.primary:hover { background-color: var(--primary-hover); }

    .multi-actions {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-danger { background-color: var(--danger) !important; color: white !important; border: none; }
    .btn-success { background-color: #28a745 !important; color: white !important; border: none; }

    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
      min-height: 18px;
    }

    .empty-state {
      padding: 30px 10px;
      text-align: center;
      color: #999;
      font-style: italic;
    }

    #linkContainer::-webkit-scrollbar { width: 6px; }
    #linkContainer::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
  </style>
</head>
<body>
  <h3>📋 Short URL Saver</h3>
  
  <div class="session-container">
    <div class="session-header">
      <select id="sessionSelect" title="Pilih Session Aktif"></select>
      <div class="btn-group">
        <button id="addSession" class="icon-btn" title="Tambah Session Baru">+</button>
        <button id="editSession" class="icon-btn" title="Ubah Nama Session">✏️</button>
        <button id="duplicateSession" class="icon-btn" title="Duplikasi Session">📋</button>
        <button id="delSession" class="icon-btn btn-danger" title="Hapus Session Ini">🗑️</button>
      </div>
    </div>
  </div>

  <div class="mode-container">
    <div class="mode-toggle-wrapper">
      <span class="mode-label">Mode Operasi:</span>
      <select id="modeSelect" class="select-mode">
        <option value="shortcut">Shortcut (Ctrl+Alt+S)</option>
        <option value="auto">Auto Save (URL Change)</option>
      </select>
    </div>
    
    <div id="autoControls" class="auto-controls">
      <div class="auto-status-indicator">
        <span id="statusDot" class="dot stopped"></span>
        <span id="statusText">Auto Save: Mati</span>
      </div>
      <button id="btnAutoToggle" class="icon-btn" style="font-weight: bold; min-width: 70px;">Start</button>
    </div>
  </div>

  <div class="list-header">
    <span>Daftar URL</span>
    <label style="font-size: 11px; cursor: pointer;">
      <input type="checkbox" id="selectAll"> Pilih Semua
    </label>
  </div>

  <div id="linkContainer">
    <div class="empty-state">Memuat data...</div>
  </div>

  <div class="main-actions">
    <button id="exportFull" class="primary">📁 Ekspor TXT (Lengkap)</button>
    <button id="exportRaw" class="primary" style="background-color: #17a2b8;">📄 Ekspor (Hanya URL)</button>
  </div>

  <div id="multiActions" class="multi-actions">
    <button id="exportSelected" class="icon-btn btn-success">Ekspor Terpilih</button>
    <button id="deleteSelected" class="icon-btn btn-danger">Hapus Terpilih</button>
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
