<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
    }
    
    h3 {
      margin: 0 0 10px 0;
      color: #0060df;
    }
    
    .info {
      background: #f0f0f0;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      font-size: 14px;
    }
    
    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background-color: #0060df;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    
    button:hover {
      background-color: #0250bb;
    }
    
    button:active {
      transform: scale(0.98);
    }
    
    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 5px;
      font-size: 12px;
      text-align: center;
    }
    
    .success {
      background-color: #d4edda;
      color: #155724;
    }
    
    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
    
    hr {
      margin: 10px 0;
    }
    
    .url-count {
      font-weight: bold;
      color: #0060df;
    }
  </style>
</head>
<body>
  <h3>📋 Short URL Saver</h3>
  
  <div class="info" id="infoBox">
    Mengambil data...
  </div>
  
  <button id="exportBtn">📁 Ekspor ke File TXT</button>
  <!-- Tambahkan ini di bawah button id="exportBtn" -->
  <button id="exportRawBtn" style="background-color: #17a2b8;">📄 Ekspor (Hanya Daftar URL)</button>
  <button id="clearBtn" style="background-color: #6c757d;">🗑️ Hapus Semua URL</button>
  
  <div id="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
